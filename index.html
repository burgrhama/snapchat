<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>pirated untitled</title>

<style>
body { margin:0; background:#000; color:white; font-family:Arial;}
header { display:flex; justify-content:space-between; padding:30px 40px; }
header h1 { font-size:42px; margin:0; }
header button { background:white; color:black; border:none; padding:12px 20px; font-weight:bold; cursor:pointer;}
.album-grid { display:grid; grid-template-columns:repeat(auto-fill,200px); gap:30px; padding:40px;}
.album-card { cursor:pointer;}
.album-card img { width:200px; height:200px; background:#333; object-fit:cover;}
.album-card p { margin-top:10px;}
.album-view { display:none; padding:40px;}
.back { cursor:pointer; color:gray; margin-bottom:20px;}
.album-layout { display:flex; gap:40px;}
.cover-large { width:350px; height:350px; background:#444; object-fit:cover; cursor:pointer;}
.album-title { font-size:32px; cursor:pointer; margin:0;}
.track { padding:10px 0; border-bottom:1px solid #222; display:flex; justify-content:space-between;}
.track span { cursor:pointer;}
.remove-btn { color:gray; cursor:pointer;}
.remove-btn:hover { color:white;}
.player { position:fixed; bottom:0; width:100%; background:#111; padding:15px;}
</style>
</head>
<body>

<header id="mainHeader">
<h1>pirated untitled</h1>
<button onclick="createAlbum()">make an album</button>
</header>

<div id="home" class="album-grid"></div>

<div id="albumPage" class="album-view">
<div class="back" onclick="goHome()">← back</div>

<div class="album-layout">
<img id="albumCover" class="cover-large">
<div style="flex:1;">
<h2 id="albumTitle" class="album-title"></h2>
<input type="file" id="songUpload" multiple accept="audio/*">
<button onclick="addSongs()">add tracks</button>
<div id="trackList"></div>
</div>
</div>
</div>

<div class="player">
<div id="nowPlaying">Nothing playing</div>
<audio id="audioPlayer" controls style="width:100%;"></audio>
</div>

<script>
let db;
let currentAlbumId = null;

const request = indexedDB.open("PiratedUntitledDB", 1);

request.onupgradeneeded = function(e) {
    db = e.target.result;
    db.createObjectStore("albums", { keyPath: "id", autoIncrement: true });
};

request.onsuccess = function(e) {
    db = e.target.result;
    renderHome();
};

function getAllAlbums(callback){
    const tx = db.transaction("albums","readonly");
    const store = tx.objectStore("albums");
    const req = store.getAll();
    req.onsuccess = () => callback(req.result);
}

function saveAlbum(album){
    const tx = db.transaction("albums","readwrite");
    const store = tx.objectStore("albums");
    store.put(album);
}

function createAlbum(){
    const tx = db.transaction("albums","readwrite");
    const store = tx.objectStore("albums");
    store.add({ name:"untitled project", cover:null, tracks:[] });
    tx.oncomplete = renderHome;
}

function renderHome(){
    getAllAlbums(albums=>{
        const home = document.getElementById("home");
        home.innerHTML="";
        albums.forEach(album=>{
            const card=document.createElement("div");
            card.className="album-card";
            card.onclick=()=>openAlbum(album.id);

            const img=document.createElement("img");
            img.src=album.cover || "";
            card.appendChild(img);

            const name=document.createElement("p");
            name.textContent=album.name;
            card.appendChild(name);

            home.appendChild(card);
        });
    });
}

function openAlbum(id){
    currentAlbumId=id;
    document.getElementById("home").style.display="none";
    document.getElementById("mainHeader").style.display="none";
    document.getElementById("albumPage").style.display="block";

    const tx=db.transaction("albums","readonly");
    const store=tx.objectStore("albums");
    const req=store.get(id);

    req.onsuccess=function(){
        const album=req.result;

        const title=document.getElementById("albumTitle");
        title.textContent=album.name;
        title.onclick=()=>{
            const newName=prompt("Rename album:",album.name);
            if(newName){
                album.name=newName;
                saveAlbum(album);
                openAlbum(id);
            }
        };

        const cover=document.getElementById("albumCover");
        cover.src=album.cover || "";
        cover.onclick=()=>{
            const input=document.createElement("input");
            input.type="file";
            input.accept="image/*";
            input.onchange=e=>{
                const reader=new FileReader();
                reader.onload=ev=>{
                    album.cover=ev.target.result;
                    saveAlbum(album);
                    openAlbum(id);
                };
                reader.readAsDataURL(e.target.files[0]);
            };
            input.click();
        };

        renderTracks(album);
    };
}

function renderTracks(album){
    const list=document.getElementById("trackList");
    list.innerHTML="";
    album.tracks.forEach((track,i)=>{
        const div=document.createElement("div");
        div.className="track";

        const name=document.createElement("span");
        name.textContent=(i+1)+". "+track.name;
        name.onclick=()=>playTrack(track.blob);

        const remove=document.createElement("div");
        remove.className="remove-btn";
        remove.textContent="remove";
        remove.onclick=()=>{
            album.tracks.splice(i,1);
            saveAlbum(album);
            renderTracks(album);
        };

        div.appendChild(name);
        div.appendChild(remove);
        list.appendChild(div);
    });
}

function addSongs(){
    const files=document.getElementById("songUpload").files;
    const tx=db.transaction("albums","readonly");
    const store=tx.objectStore("albums");
    const req=store.get(currentAlbumId);

    req.onsuccess=function(){
        const album=req.result;

        Array.from(files).forEach(file=>{
            album.tracks.push({ name:file.name, blob:file });
        });

        saveAlbum(album);
        renderTracks(album);
    };
}

function playTrack(blob){
    const player=document.getElementById("audioPlayer");
    player.src=URL.createObjectURL(blob);
    player.play();
}

function goHome(){
    document.getElementById("albumPage").style.display="none";
    document.getElementById("home").style.display="grid";
    document.getElementById("mainHeader").style.display="flex";
    renderHome();
}
</script>

</body>
</html>
